<html>
    <head>
        <title>JavaScript variable</title>
    </head>
    <body>
        <h1>variable JavaScript</h1>

        <script>
            //let greeting = "Hello Aldi"
            //let message = "Belajar Javascript"

            //document.writeln(greeting);
            //document.writeln("</br>");
            //document.writeln(message);
            //document.writeln("<br>");

            let greeting = 123;
            document.write(greeting + ">");
            document.write(typeof(greeting))
            document.writeln('</br>');

            let message = "123"
            document.write(message + '>');
            document.write(typeof(message))
            document.write('</br>');

            let result = 1 + 2;
            document.writeln("<p>1+2="+result+"</p>");
            let originalResult = result;

            result = result - 1;
            document.writeln("<p>"+originalResult+"-1="+result+"</p>");
            originalResult = result;

            result = result *2;
            document.writeln("<p>"+originalResult+"*2="+result+"</p>");
            originalResult = result;

            let hasil = 10;
            hasil = 10;
            hasil += 10;
            document.writeln("<p>"+hasil+"</p>")
            hasil -= 10;
            document.writeln("<p>"+hasil+"</p>")
        </script>
    </body>
