<html>
    <head>
        <title>Contoh Closure</title>
    </head>
    <body>
        <script>
             function outerFunction(outerVariabel){
               return function innerFunction(innerVariabel){
                    document.write("Outer Variabel: " + outerVariabel + "</br>");
                    document.write("Inner Variabel: " + innerVariabel + "</br>");
                };
            }
            const newFunction = outerFunction("Outer");
            newFunction("Inner");
            newFunction("Outer");
        </script>
    </body>
</html>
