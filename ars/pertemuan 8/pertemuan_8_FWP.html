<html>
    <head>
        <title>Function contoh</title>
    </head>
    <body>
        <script> 
        function sayHello(firstname, lastname) {
            document.write( `Hello ${firstname} ${lastname} !</br>`);
        }
        // manggil function
        sayHello('Aldi', 'Soamole');
        sayHello('David', 'Maulana');
        </script>
    </body>\
</html>
